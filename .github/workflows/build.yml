name: build

# macOS only, on purpose: the viewer decodes through ImageIO and claims file
# types through LaunchServices, neither of which exists elsewhere. Run it by
# hand from the Actions tab, or push a tag like v0.1.0 — a tag also publishes a
# GitHub Release with the .dmg attached.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write


    steps:
      - uses: actions/checkout@v4

      # The local `.cargo/config.toml` redirects builds into `target.noindex` so
      # Spotlight ignores the intermediates on a Mac. On a runner that only
      # causes trouble: tauri-action resolves where the bundles landed from
      # cargo's own metadata, and an override makes the two disagree — the build
      # succeeds and then reports "No artifacts were found".
      - name: Use the default target directory
        # Explicit bash so the step behaves the same if this workflow ever grows
        # a Windows leg: PowerShell aliases `rm` to Remove-Item, where `-f` is
        # ambiguous between -Filter and -Force.
        shell: bash
        run: rm -f src-tauri/.cargo/config.toml


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend deps
        run: npm ci

      - name: Test
        run: |
          npm run build
          cd src-tauri && cargo test

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "lil view ${{ github.ref_name }}"
          releaseDraft: false
          prerelease: false
          args: --target aarch64-apple-darwin

      # A manual run has no tag and therefore no Release, so expose the
      # installer as a run artifact too.
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: lil-view-macos
          if-no-files-found: ignore
          path: src-tauri/target/**/release/bundle/**/*.dmg
